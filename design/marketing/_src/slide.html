<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GeoNoMore store slide</title>
<!-- Magaza gorseli sablonu, 1280x800. ?b=chromium|firefox&s=<id>&v=<json>
     v: { rw, ox, oy, z, mark:[x,y,w,h] } ham arayuz goruntusunde (css px, rw genis, varsayilan 1100)
     kirpma, yakinlastirma ve isaret. slide-jobs.js hesaplar. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=block" rel="stylesheet">
<style>
  :root {
    --bg: #0d0e0b; --ink: #C4F22A; --text: #f4f5ef; --mute: #b3b7aa;
    --frame: #1b1c19; --frame2: #262723; --line: #33342f; --ui: #121212;
    --font: "Outfit", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 800px; overflow: hidden; background: var(--bg); color: var(--text);
    font-family: var(--font); -webkit-font-smoothing: antialiased; }
  body { position: relative; }

  /* Zemin: ustte tek lime hale, ince izgara yalniz ust yarida */
  .glow { position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(760px 420px at 50% -6%, rgba(196,242,42,.22), transparent 64%),
      radial-gradient(520px 360px at 100% 110%, rgba(196,242,42,.06), transparent 70%); }
  .grid { position: absolute; inset: 0; pointer-events: none;
    background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(ellipse 70% 45% at 50% 0%, #000 30%, transparent 80%); }

  .brand { position: absolute; left: 48px; top: 36px; display: flex; align-items: center; gap: 12px;
    font-weight: 600; font-size: 22px; letter-spacing: -.01em; }
  .brand img { width: 38px; height: 38px; }
  .for { position: absolute; right: 48px; top: 40px; display: flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--ink);
    padding: 8px 14px 8px 12px; border-radius: 999px; background: rgba(196,242,42,.08);
    box-shadow: inset 0 0 0 1.5px rgba(196,242,42,.45); }
  .for svg { width: 14px; height: 14px; }

  .head { position: absolute; left: 0; right: 0; top: 92px; text-align: center; }
  h1 { font-size: 56px; line-height: 1.04; font-weight: 700; letter-spacing: -.03em; }
  h1 em { font-style: normal; color: var(--ink); }
  .sub { margin-top: 12px; font-size: 21px; font-weight: 400; color: var(--mute); letter-spacing: -.005em; }

  /* Tarayici penceresi: Chrome ve Firefox icin ayri cerceve, marka logosu yok */
  .win { position: absolute; left: 80px; top: 222px; width: 1120px; height: 640px;
    border-radius: 16px 16px 0 0; background: var(--frame); overflow: hidden;
    box-shadow: 0 0 0 1px var(--line), 0 40px 90px rgba(0,0,0,.65), 0 0 140px rgba(196,242,42,.07); }
  .bar { height: 64px; position: relative; border-bottom: 1px solid var(--line); }
  .dots { position: absolute; left: 18px; top: 14px; display: flex; gap: 8px; }
  .dots i { width: 11px; height: 11px; border-radius: 50%; background: #45463f; }
  .tab { position: absolute; display: flex; align-items: center; gap: 8px; padding: 0 16px 0 12px;
    font-size: 13px; font-weight: 500; color: var(--text); white-space: nowrap; }
  .tab img { width: 16px; height: 16px; }
  .url { position: absolute; top: 38px; height: 22px; font-size: 12px; color: var(--mute);
    display: flex; align-items: center; padding: 0 14px; letter-spacing: .01em; }
  .tools { position: absolute; right: 16px; top: 39px; display: flex; gap: 12px; align-items: center; }
  .tools i { width: 16px; height: 16px; border-radius: 4px; background: #45463f; display: block; }
  .tools img { width: 18px; height: 18px; }
  .view { position: absolute; left: 0; right: 0; top: 64px; bottom: 0; overflow: hidden; background: var(--ui); }
  .view img { position: absolute; display: block; }

  /* Chrome: koyu serit, yuvarlak ust koseli sekme, genis yuvarlak adres */
  [data-b=chromium] .bar { background: #151613; }
  [data-b=chromium] .tab { left: 82px; top: 6px; height: 30px; background: var(--frame2); border-radius: 10px 10px 0 0; }
  [data-b=chromium] .url { left: 14px; right: 110px; border-radius: 11px; background: #22231f; }
  /* Firefox: ust cizgili kart sekme, kose yuvarlakligi kucuk, adres ortada */
  [data-b=firefox] .tab { left: 82px; top: 5px; height: 30px; background: var(--frame2); border-radius: 6px;
    box-shadow: inset 0 2px 0 var(--ink); }
  [data-b=firefox] .url { left: 120px; right: 150px; border-radius: 6px; background: #22231f; justify-content: center; }

  /* Tarayiciya ozel secenegi isaretleyen cerceve ve etiketi */
  .mark { position: absolute; border: 2.5px solid var(--ink); border-radius: 12px;
    box-shadow: 0 0 0 6px rgba(196,242,42,.12), 0 0 44px rgba(196,242,42,.35); }
  .mark b { position: absolute; right: -2px; top: -30px; font-size: 12px; font-weight: 700; letter-spacing: .1em;
    text-transform: uppercase; color: #10120b; background: var(--ink); padding: 4px 10px; border-radius: 6px 6px 0 0; }

  /* Popup slaydi: solda metin, sagda arac cubugu ve acilan panel */
  .split .head { left: 80px; right: auto; width: 560px; top: 236px; text-align: left; }
  .split h1 { font-size: 64px; }
  .points { margin-top: 34px; display: grid; gap: 16px; font-size: 20px; font-weight: 500; }
  .points div { display: flex; gap: 14px; align-items: center; }
  .points svg { width: 22px; height: 22px; flex: none; }
  .tb { position: absolute; right: 80px; top: 104px; width: 460px; height: 54px; border-radius: 12px;
    background: var(--frame); box-shadow: 0 0 0 1px var(--line); display: flex; align-items: center;
    justify-content: flex-end; gap: 14px; padding: 0 14px; }
  .tb i { width: 20px; height: 20px; border-radius: 5px; background: #45463f; display: block; }
  .tb .me { width: 34px; height: 34px; border-radius: 9px; background: rgba(196,242,42,.14);
    display: grid; place-items: center; box-shadow: 0 0 0 1.5px rgba(196,242,42,.6); }
  .tb .me img { width: 22px; height: 22px; }
  .pop { position: absolute; right: 116px; top: 170px; width: 384px; border-radius: 14px; overflow: hidden;
    box-shadow: 0 0 0 1px var(--line), 0 40px 90px rgba(0,0,0,.7), 0 0 120px rgba(196,242,42,.10); }
  .pop img { display: block; width: 100%; }
</style>
</head>
<body>
<div class="glow"></div><div class="grid"></div>
<div id="root"></div>
<script>
  var q = new URLSearchParams(location.search);
  var B = q.get('b') || 'chromium', S = q.get('s') || 'location';
  var V = JSON.parse(q.get('v') || '{}');
  document.body.setAttribute('data-b', B);
  var NAME = B === 'firefox' ? 'Firefox' : 'Chrome';
  var LOGO = '../../../src/assets/logo/logo2/c-pin/logo2.svg';
  var ICON = '../../../src/assets/logo/logo2/c-pin/128.png';
  var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#C4F22A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" stroke-opacity=".35"/><path d="M7.5 12.5l3 3 6-6.5"/></svg>';
  var SHIELD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/></svg>';

  // Slayt metinleri: tek mesaj, kisa alt satir. Tarayiciya ozel olan yalniz 'protect'.
  var T = {
    location: ['Your location, <em>your rules.</em>', 'Pick any place on the map. Sites see that place, not yours.'],
    identity: ['Every clue tells <em>the same story.</em>', 'Time zone, language and IP lookups follow the place you pick.'],
    protect: B === 'firefox'
      ? ['Made for <em>Firefox.</em>', 'Tracking protection in every window, on top of leak and fingerprint shields.']
      : ['Made for <em>Chrome.</em>', 'Turns off Privacy Sandbox ad tracking, on top of leak and fingerprint shields.'],
    moving: ['Stand still, <em>or keep moving.</em>', 'A fixed point, a private zone, or a route that walks itself.']
  };

  var root = document.getElementById('root');
  var brand = '<div class="brand"><img src="' + LOGO + '" alt="">GeoNoMore</div>' +
    '<div class="for">' + SHIELD + 'For ' + NAME + '</div>';

  if (S === 'popup') {
    document.body.classList.add('split');
    root.innerHTML = brand +
      '<div class="head"><h1>One click on.<br><em>One click off.</em></h1>' +
      '<p class="sub">The toolbar popup shows what sites see right now.</p>' +
      '<div class="points"><div>' + CHECK + 'No account, no sign up</div><div>' + CHECK +
      'Settings stay in your browser</div><div>' + CHECK + 'No data collected</div></div></div>' +
      '<div class="tb"><i></i><i></i><i></i><span class="me"><img src="' + ICON + '" alt=""></span><i></i></div>' +
      '<div class="pop"><img src="raw/' + B + '-popup.png" alt=""></div>';
  } else {
    var t = T[S];
    root.innerHTML = brand +
      '<div class="head"><h1>' + t[0] + '</h1><p class="sub">' + t[1] + '</p></div>' +
      '<div class="win"><div class="bar"><div class="dots"><i></i><i></i><i></i></div>' +
      '<div class="tab"><img src="' + ICON + '" alt="">GeoNoMore Settings</div>' +
      '<div class="url">' + (B === 'firefox' ? 'moz-extension://geonomore/ui/options.html' : 'chrome-extension://geonomore/ui/options.html') + '</div>' +
      '<div class="tools"><i></i><img src="' + ICON + '" alt=""><i></i></div></div>' +
      '<div class="view"><img id="shot" src="raw/' + B + '-' + S + '.png" alt=""></div></div>';

    // Ham goruntu 1100 css px genis; pencere 1120. z ile yakinlastir, ox/oy ile kaydir.
    var RW = V.rw || 1100, K = 1120 / RW, z = V.z || 1, ox = V.ox || 0, oy = V.oy || 0, f = K * z;
    var img = document.getElementById('shot');
    img.style.width = (RW * f) + 'px';
    img.style.left = (-ox * f) + 'px';
    img.style.top = (-oy * f) + 'px';
    if (V.mark) {
      var m = document.createElement('div');
      m.className = 'mark';
      m.innerHTML = '<b>' + NAME + ' only</b>';
      // Isaret yalniz satir etiketini olcer; cevresinde nefes payi birak
      m.style.left = ((V.mark[0] - ox) * f - 16) + 'px';
      m.style.top = (64 + (V.mark[1] - oy) * f - 15) + 'px';
      m.style.width = (V.mark[2] * f + 40) + 'px';
      m.style.height = (V.mark[3] * f + 30) + 'px';
      document.querySelector('.win').appendChild(m);
    }
  }
</script>
</body>
</html>
