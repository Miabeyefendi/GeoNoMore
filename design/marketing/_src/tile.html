<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GeoNoMore store tile</title>
<!-- ?t=small (440x280) | marquee (1400x560) | icon (128x128, 96 cizim + 16 saydam kenar) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=block" rel="stylesheet">
<style>
  :root { --bg: #0d0e0b; --ink: #C4F22A; --text: #f4f5ef; --mute: #b3b7aa; --line: #33342f;
    --font: "Outfit", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; color: var(--text); font-family: var(--font);
    -webkit-font-smoothing: antialiased; }
  body.bg { background: var(--bg); }
  .glow { position: absolute; inset: 0;
    background: radial-gradient(60% 85% at 20% 50%, rgba(196,242,42,.22), transparent 66%); }
  .grid { position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
    background-size: 28px 28px;
    mask-image: radial-gradient(ellipse 45% 70% at 20% 50%, #000 20%, transparent 75%); }

  /* Kucuk karo: listede yariya kadar kuculur; az yazi, buyuk logo, kenara bosluk */
  .small { position: absolute; inset: 0; display: flex; align-items: center; gap: 22px; padding: 0 32px; }
  .small img { width: 128px; height: 128px; flex: none; filter: drop-shadow(0 10px 24px rgba(0,0,0,.5)); }
  .small h1 { font-size: 42px; font-weight: 700; letter-spacing: -.03em; line-height: 1; }
  .small p { margin-top: 12px; font-size: 20px; color: var(--ink); font-weight: 600; line-height: 1.2; letter-spacing: -.01em; }

  /* Pankart: logo + metin solda, popup sagda tam gorunur */
  .marquee { position: absolute; left: 96px; top: 0; bottom: 0; display: flex; align-items: center; gap: 52px; }
  .marquee .logo { width: 236px; height: 236px; flex: none; filter: drop-shadow(0 20px 40px rgba(0,0,0,.5)); }
  .marquee h1 { font-size: 76px; font-weight: 700; letter-spacing: -.035em; line-height: 1; }
  .marquee h2 { margin-top: 16px; font-size: 34px; font-weight: 600; color: var(--ink); letter-spacing: -.02em; }
  .marquee p { margin-top: 16px; font-size: 22px; color: var(--mute); }
  .shot { position: absolute; right: 96px; top: 50%; transform: translateY(-50%); width: 316px; border-radius: 14px;
    overflow: hidden; box-shadow: 0 0 0 1px var(--line), 0 30px 80px rgba(0,0,0,.6), 0 0 120px rgba(196,242,42,.12); }
  .shot img { display: block; width: 100%; }

  .icon { position: absolute; left: 16px; top: 16px; width: 96px; height: 96px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var t = new URLSearchParams(location.search).get('t') || 'small';
  var LOGO = '../../../src/assets/logo/logo2/c-pin/logo2.svg';
  var root = document.getElementById('root');
  if (t === 'icon') {
    root.innerHTML = '<img class="icon" src="' + LOGO + '" alt="">';
  } else {
    document.body.className = 'bg';
    var deco = '<div class="glow"></div><div class="grid"></div>';
    if (t === 'small') {
      root.innerHTML = deco + '<div class="small"><img src="' + LOGO + '" alt="">' +
        '<div><h1>GeoNoMore</h1><p>Fake location.<br>Real privacy.</p></div></div>';
    } else {
      root.innerHTML = deco +
        '<div class="marquee"><img class="logo" src="' + LOGO + '" alt="">' +
        '<div><h1>GeoNoMore</h1><h2>Fake location. Real privacy.</h2>' +
        '<p>No account. No data collected.</p></div></div>' +
        '<div class="shot"><img src="raw/chromium-popup.png" alt=""></div>';
    }
  }
</script>
</body>
</html>
